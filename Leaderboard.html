<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="Leaderboard.css">  
    <script src="leaderboard_Faizan.js" defer="true"></script>
    <script src="levels_Faizan.js" defer="true"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap');
        </style>
</head>
<body>
    <div id="game-over-container">
        <h1 id="game-over-title">Game Over!</h1>
        <div id="leaderboard-container">
            <p id="difficulty">Current Difficulty: <span id="difficulty-level">X</span></p>
            <p id="name">Your Name: <span id="playerNameDisplay"></span></p>
            <div id="leaderboard-section">
                <h2 id="leaderboard-title">Leaderboard</h2>
                <ul id="leaderboard">
                    <li><span>Faizan</span> <span>3</span></li>
                    <li><span>Labiba</span> <span>2</span></li>
                    <li><span>Player C</span> <span>1</span></li>
                    <li><span>Player D</span> <span>0</span></li>
                    <li><span>Amal</span> <span>0</span></li>
                    <li><span>Player F</span> <span>0</span></li>
                </ul>
            </div>
            <button id="main-menu-button">Main Menu</button>            
        </div>
    </div>
</body>
</html>
