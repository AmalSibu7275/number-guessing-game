<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Mode</title>
    <link rel="stylesheet" href="easy3.css">  
    <link rel="stylesheet" href="../Amal_Code/crowpopup2.css">
    <script src="../Amal_Code/crowpopup2.js"></script>
    <script src="../Amal_Code/life.js" defer="true"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap');
        </style>
</head>
<body>
    <div class="title">
        <h1>Easy Mode: Level 3</h1>
        <h2>Behind the Curtains</h2>
       </div>
    <div class="input-container">
        <input type="number" id="userInput" placeholder="Enter a number" style="width: 275px; padding: 20px; border: 5px solid rgb(255, 0, 0); border-radius: 6px; font-size: 30px; background-color: gainsboro;">
        <button id="submitButton" class="guess">Guess Your Fate</button>
    </div>
    <div class="popup" id="popup">
        <img id="crow1" src="../Amal_Code/Remove background project 1.png" alt="crow1" style="display: none;">
        <img id="crow2" src="../Amal_Code/Remove background project 2.png" alt="crow2" style="display: none;">
        <img id="ghost" src="../Amal_Code/ghost2.png" alt="ghostFace1" style="display: none;">
        <img id="ghost3" src="../Amal_Code/lose.png" alt="ghostFace3" style="display: none;">
        <button type="button" id="closePopup">OK</button>
    </div>
